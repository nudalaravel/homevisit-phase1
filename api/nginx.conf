# PHP Proxy API - Nginx Configuration
# สำหรับใช้กับ Nginx web server

location /api {
    try_files $uri $uri/ /api/proxy.php?$query_string;
    
    # PHP configuration
    fastcgi_pass unix:/var/run/php/php7.4-fpm.sock; # ปรับตาม PHP version
    fastcgi_index proxy.php;
    fastcgi_param SCRIPT_FILENAME $document_root/api/proxy.php;
    
    include fastcgi_params;
    
    # CORS headers
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept" always;
    
    # Handle OPTIONS preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-Width, Accept" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}


