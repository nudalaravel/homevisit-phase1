<!DOCTYPE html>
<html>

<head>
    <title>IndexedDB Test</title>
</head>

<body>
    <h1>IndexedDB Test</h1>
    <div id="status">Testing...</div>
    <div id="result"></div>

    <script>
        function testIndexedDB() {
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');

            try {
                // Test if IndexedDB is available
                if (typeof indexedDB === 'undefined') {
                    statusDiv.innerHTML = '❌ IndexedDB is not available';
                    return;
                }

                statusDiv.innerHTML = '✅ IndexedDB is available';

                // Test opening a database
                const request = indexedDB.open('TestDB', 1);

                request.onerror = function (event) {
                    resultDiv.innerHTML = '❌ Failed to open database: ' + event.target.error;
                };

                request.onsuccess = function (event) {
                    const db = event.target.result;
                    resultDiv.innerHTML = '✅ Database opened successfully';
                    db.close();
                };

                request.onupgradeneeded = function (event) {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('test')) {
                        db.createObjectStore('test', { keyPath: 'id' });
                    }
                };

            } catch (error) {
                statusDiv.innerHTML = '❌ Error: ' + error.message;
            }
        }

        // Run test when page loads
        window.addEventListener('load', testIndexedDB);
    </script>
</body>

</html>
